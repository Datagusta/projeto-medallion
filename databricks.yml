bundle:
  name: anp_medallion

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog usado pelo projeto
    default: gas_medallion
  warehouse_id:
    description: ID do SQL Warehouse usado pela task do dbt
    default: 3ba09187541320bd
  git_url:
    description: URL do repositório no GitHub (público), de onde o job busca o projeto dbt
    default: https://github.com/Fallenback/projeto-medallion

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-461dd8b5-69ca.cloud.databricks.com
